name: Release unsigned Windows test installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag selected as the workflow ref
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate tag, main ancestry, version, and changelog
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_TAG"
            if [[ "$SELECTED_REF" != "refs/tags/$release_tag" ]]; then
              echo "Manual releases must select the same existing tag as the workflow ref." >&2
              exit 1
            fi
          else
            release_tag="$PUSH_TAG"
          fi

          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable releases require an exact vMAJOR.MINOR.PATCH tag." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "The stable main branch is unavailable in the checkout." >&2
            exit 1
          fi

          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$release_tag")"
          if [[ ! "$head_commit" =~ ^[0-9a-f]{40}$ || "$tag_commit" != "$head_commit" ]]; then
            echo "The checked-out commit does not match the requested tag." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            echo "The release tag is not contained in main." >&2
            exit 1
          fi

          release_version="$(node tooling/release/verify-version.mjs --tag "$release_tag")"
          {
            echo "sha=$head_commit"
            echo "tag=$release_tag"
            echo "version=$release_version"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build unsigned Windows test release
    needs: metadata
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          version: 11.23.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Restore the hash-verified vendor archive cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: windows-payload-${{ hashFiles('apps/local-api/windows/payload-lock.json') }}
          path: artifacts/windows/cache

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source on Windows
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          & node.exe tooling/release/verify-version.mjs --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "release version validation failed" }
          & pnpm.cmd lint
          if ($LASTEXITCODE -ne 0) { throw "lint failed" }
          & pnpm.cmd format:check
          if ($LASTEXITCODE -ne 0) { throw "format check failed" }
          & pnpm.cmd typecheck
          if ($LASTEXITCODE -ne 0) { throw "typecheck failed" }
          & pnpm.cmd test:unit
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }

      - name: Build application and hash-verified payload without signing secrets
        shell: pwsh
        run: |
          & pnpm.cmd build
          if ($LASTEXITCODE -ne 0) { throw "application build failed" }
          & pnpm.cmd package:windows:payload
          if ($LASTEXITCODE -ne 0) { throw "Windows payload preparation failed" }

      - name: Build the unsigned development installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          try {
            $env:BREEV_WINDOWS_BUILD_VERSION = $env:RELEASE_VERSION
            $env:BREEV_WINDOWS_CERTIFICATE_FILE = $null
            $env:BREEV_WINDOWS_CERTIFICATE_PASSWORD = $null
            $env:BREEV_WINDOWS_REQUIRE_SIGNING = "0"

            & pnpm.cmd --filter @breev/desktop package:windows
            if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }
          } finally {
            $env:BREEV_WINDOWS_BUILD_VERSION = $null
            $env:BREEV_WINDOWS_CERTIFICATE_FILE = $null
            $env:BREEV_WINDOWS_CERTIFICATE_PASSWORD = $null
            $env:BREEV_WINDOWS_REQUIRE_SIGNING = $null
          }

      - name: Verify and stage the release allowlist
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          ./tooling/release/Stage-WindowsRelease.ps1 `
            -BuilderOutputRoot artifacts/windows/electron-builder `
            -ReleaseRoot artifacts/release `
            -ReleaseTag $env:RELEASE_TAG `
            -ReleaseVersion $env:RELEASE_VERSION `
            -SourceCommit $env:RELEASE_SHA `
            -SigningMode unsigned-development

      - name: Attest release build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts/release/*

      - name: Upload short-lived QA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: breev-${{ needs.metadata.outputs.tag }}-windows-release
          path: artifacts/release/*
          retention-days: 14

  create-draft:
    name: Create draft GitHub Release
    needs:
      - metadata
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: breev-${{ needs.metadata.outputs.tag }}-windows-release
          path: release

      - name: Verify the SHA-256 manifest
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Create a new draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG; refusing to replace assets." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --verify-tag --draft --prerelease --generate-notes --notes "Unsigned development build for release-flow testing only. Windows will show an unknown-publisher warning. Do not publish this draft as a stable client release." --title "Breev $RELEASE_VERSION (unsigned development test)"
