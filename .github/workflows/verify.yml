name: Verify

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  # The Windows jobs bill at 2x hosted-runner minutes and dominate the budget,
  # so they run on demand. Trigger a full run, Windows jobs included, from the
  # Actions tab (Run workflow) or `gh workflow run Verify --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-cng-proof:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
          version: 11.23.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove Windows CNG software fallback
        run: pnpm --filter @breev/local-api exec vitest run --config vitest.unit.config.ts src/pharmacy-ca/pharmacy-ca-crypto.unit.test.ts

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
          version: 11.23.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and unit seams
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm build
          pnpm test:unit

      - name: Verify PostgreSQL integration seam
        run: pnpm test:integration

      - name: Install browser test dependencies
        run: pnpm --filter @breev/desktop exec playwright install --with-deps chromium

      - name: Verify renderer browser seam
        run: pnpm test:browser

      - name: Package desktop for the Electron seam
        run: pnpm build && pnpm package:desktop

      - name: Configure the runner Chromium sandbox
        run: |
          sudo chown root:root artifacts/Breev-linux-x64/chrome-sandbox
          sudo chmod 4755 artifacts/Breev-linux-x64/chrome-sandbox

      - name: Verify packaged Electron seam
        run: xvfb-run --auto-servernum pnpm --filter @breev/desktop exec playwright test --config playwright.config.ts

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: desktop-smoke-evidence
          path: test-results/desktop

  windows-candidates:
    runs-on: windows-2025
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
          version: 11.23.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source on Windows
        shell: bash
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm build
          pnpm --filter @breev/contracts test:unit
          pnpm --filter @breev/desktop test:unit
          pnpm --filter @breev/local-api exec vitest run --config vitest.unit.config.ts --exclude src/pharmacy-ca/pharmacy-ca-crypto.unit.test.ts
          pnpm test:boundaries

      - name: Build both unsigned Windows comparison candidates
        shell: powershell
        run: |
          $runId = [Guid]::NewGuid()
          ./tooling/windows/Build-WindowsCandidates.ps1 `
            -RunId $runId `
            -SnapshotId "github-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Record Windows CI evidence
        shell: powershell
        run: |
          ./tooling/windows/Write-WindowsCiEvidence.ps1 `
            -PackagingRoot artifacts/windows/candidates `
            -SourceCommit (git rev-parse HEAD).Trim() `
            -OutputPath artifacts/windows/ci/windows-ci.json

      - name: Upload Windows build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: windows-candidate-evidence
          path: |
            artifacts/windows/ci/windows-ci.json
            artifacts/windows/candidates/packaging-results.json
            artifacts/windows/candidates/**/fuses.json
