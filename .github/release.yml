changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: Breaking changes
      labels:
        - breaking-change
        - Semver-Major
    - title: Features
      labels:
        - enhancement
        - feature
        - Semver-Minor
    - title: Fixes
      labels:
        - bug
        - fix
        - Semver-Patch
    - title: Documentation and maintenance
      labels:
        - dependencies
        - documentation
        - maintenance
    - title: Other changes
      labels:
        - "*"
